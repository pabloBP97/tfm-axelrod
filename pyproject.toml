[project]
name = "tfm-axelrod"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "axelrod>=4.14.0",
    "fastapi>=0.163.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
azure = [
    "azure-storage-file-datalake>=12.26.1",
]
spark = [
    "pyspark==4.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
